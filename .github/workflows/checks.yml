name: Quick checks

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: res/update/update_metadata_requirements.txt

      - name: Install release test dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Test release versions and update signatures
        run: |
          python -m unittest discover -s .github/scripts -p test_android_release.py
          python -m unittest res/update/test_generate_update_metadata.py res/update/test_update_metadata_cli.py

      - name: Install pinned actionlint
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: Check build and release workflows
        # The disabled legacy web job contains a pre-existing `if: False`.
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= -ignore 'undefined variable "False"' \
            .github/workflows/checks.yml \
            .github/workflows/flutter-ci.yml \
            .github/workflows/flutter-nightly.yml \
            .github/workflows/flutter-tag.yml \
            .github/workflows/flutter-build.yml \
            .github/workflows/bridge.yml \
            .github/workflows/release.yml
